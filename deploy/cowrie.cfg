# Configuracion de Cowrie para k0Pot.
#
# Se superpone a la que trae la imagen (cowrie.cfg.dist): aqui solo va lo
# que cambiamos, no una copia entera, para que al actualizar la imagen
# heredemos sus mejoras en todo lo demas.

[telnet]
# Viene desactivado de fabrica. Telnet es el protocolo favorito de las
# botnets de IoT (Mirai y derivados), asi que en un honeypot aporta mas
# trafico real que casi ningun otro servicio.
enabled = true
# 0.0.0.0 es DENTRO del contenedor, que esta en su propia red: quien
# decide la exposicion real es el mapeo de puertos del compose, atado a
# la IP de la VLAN.
listen_endpoints = tcp:2223:interface=0.0.0.0

[honeypot]
# El nombre de la maquina se fija AQUI en vez de heredarlo de la imagen:
# el botin lo menciona (la clave publica dice root@svr04) y si Cowrie
# dijera otra cosa, un 'hostname' delataria la costura.
hostname = svr04

# Salida creible para comandos que Cowrie no emula (mysql, docker,
# aws, sshpass), para que el botin del FS no delate la trampa con
# 'command not found'. Ver deploy/cowrie-txtcmds.
txtcmds_path = /cowrie/txtcmds

[shell]
# Sistema de ficheros falso con "botin": .env, claves SSH/AWS, historiales y
# un crontab con credenciales (todas FALSAS, cebo) para que quien entre por
# SSH encuentre secretos creibles y se entretenga. Ver deploy/plantar-botin.py.
filesystem = /cowrie/fs.pickle
